MOD_BEARSAMPP_STATS="Bearsampp Stats Grid"
MOD_BEARSAMPP_STATS_DESC="Displays a 5×4 grid of Bearsampp modules with a stats icon. Clicking a card opens a popup showing the stats/dashboard.md from each module's GitHub repo."

MOD_BEARSAMPP_STATS_MODULES_LABEL="Modules list"
MOD_BEARSAMPP_STATS_MODULES_DESC="Comma-separated list of module repos (e.g. module-apache,module-bruno,...). Spaces after commas are allowed (module-apache, module-bruno). Plain names (apache) resolve to the same repo. Order shown left-to-right, top-to-bottom."

MOD_BEARSAMPP_STATS_PARENT_LABEL="Parent repository"
MOD_BEARSAMPP_STATS_PARENT_DESC="GitHub organisation/user that hosts the module repos, e.g. https://github.com/Bearsampp. Enter your own path if the modules are forked to a different account (for example https://github.com/YourName or just YourName)."

MOD_BEARSAMPP_STATS_BRANCH_LABEL="Branch"
MOD_BEARSAMPP_STATS_BRANCH_DESC="Git branch to fetch stats/dashboard.md from (usually 'main')."

MOD_BEARSAMPP_STATS_FOLDER_LABEL="Stats folder"
MOD_BEARSAMPP_STATS_FOLDER_DESC="Folder inside each module repo that holds dashboard.md and its charts, e.g. gh-dl (default) or stats."

MOD_BEARSAMPP_STATS_CACHE_TTL_LABEL="Cache TTL (minutes)"
MOD_BEARSAMPP_STATS_CACHE_TTL_DESC="Browser localStorage cache for fetched markdown. Set to 0 to disable client cache."

MOD_BEARSAMPP_STATS_SHOW_ICONS_LABEL="Show stats icon"
MOD_BEARSAMPP_STATS_SHOW_ICONS_DESC="Show the chart icon on each card."

MOD_BEARSAMPP_STATS_ICON_LABEL="Stats icon (Font Awesome code)"
MOD_BEARSAMPP_STATS_ICON_DESC="Font Awesome icon classes shown on each card, e.g. fas fa-chart-bar. Change the FA code to use another icon. Leave empty to use the built-in SVG chart icon. Font Awesome must be loaded by your site template."

MOD_BEARSAMPP_STATS_LOADING="Loading stats..."
MOD_BEARSAMPP_STATS_ERROR_FETCH="Failed to load stats from GitHub."
MOD_BEARSAMPP_STATS_NO_STATS="Stats coming soon for this module."
MOD_BEARSAMPP_STATS_STATS_FOR="Stats:"
MOD_BEARSAMPP_STATS_CLOSE="Close"
